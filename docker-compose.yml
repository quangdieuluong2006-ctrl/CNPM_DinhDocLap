# SQL Server 2022 cho máy chưa cài SQL Server: docker compose up -d sqlserver
# (Máy đã cài SQL Server trên Windows thì không cần file này – xem api/README.md.)
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:?Hãy tạo file .env từ .env.example}
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -b -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

volumes:
  mssql-data:
