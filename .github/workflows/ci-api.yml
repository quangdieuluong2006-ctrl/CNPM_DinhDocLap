name: CI API

on:
  push:
    branches: [main, develop]
    paths: ["api/**", "db/**", ".github/workflows/ci-api.yml"]
  pull_request:
    branches: [main, develop]
    paths: ["api/**", "db/**", ".github/workflows/ci-api.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    # SQL Server 2022 chạy dạng service container để test tích hợp trên CSDL thật (PRD mục 16.2)
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Ci_Passw0rd_123
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Ci_Passw0rd_123' -Q 'SELECT 1' -b -o /dev/null"
          --health-interval 10s --health-timeout 5s --health-retries 15 --health-start-period 30s
    defaults:
      run:
        working-directory: api
    env:
      RUN_DB_TESTS: "1"
      DB_SERVER: localhost
      DB_PORT: "1433"
      DB_USER: sa
      DB_PASSWORD: Ci_Passw0rd_123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
